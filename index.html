<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sito di Pietro</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family: Arial, Helvetica, sans-serif;
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
        }

        .container{
            background:white;
            padding:40px;
            border-radius:20px;
            box-shadow:0 10px 30px rgba(0,0,0,0.2);
            text-align:center;
            max-width:600px;
            animation: fadeIn 1s ease;
        }

        h1{
            color:#222;
            margin-bottom:15px;
            transition:0.3s;
        }

        h1:hover{
            color:#ff8c00;
            transform:scale(1.05);
        }

        h4{
            color:#555;
            margin-bottom:30px;
            transition:0.3s;
        }

        h4:hover{
            color:#00c853;
        }

        .github-link{
            display:inline-block;
            text-decoration:none;
            background:#24292e;
            color:white;
            padding:15px 30px;
            border-radius:50px;
            font-size:18px;
            font-weight:bold;
            transition:0.3s;
        }

        .github-link:hover{
            background:#ff8c00;
            transform:translateY(-3px);
            box-shadow:0 5px 15px rgba(0,0,0,0.3);
        }

        @keyframes fadeIn{
            from{
                opacity:0;
                transform:translateY(30px);
            }
            to{
                opacity:1;
                transform:translateY(0);
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Ciao, sono Pietro Burini 👋</h1>

        <h4>Benvenuto nel mio sito personale</h4>

        <a class="github-link"
           href="http://burinburen.altervista.org/"
           target="_blank">
            🌐 Visita il mio sito
        </a>
    </div>

</body>
</html>
