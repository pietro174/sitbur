<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pietro Burini</title>

<style>
body{
    background:#000;
    color:#00ff41;
    font-family: Consolas, monospace;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    margin:0;
}

.terminal{
    width:700px;
    max-width:90%;
    border:2px solid #00ff41;
    padding:30px;
    box-shadow:0 0 20px #00ff41;
}

.line{
    margin:15px 0;
}

.name{
    font-size:2rem;
    font-weight:bold;
}

.cursor{
    animation: blink 1s infinite;
}

@keyframes blink{
    50%{
        opacity:0;
    }
}

a{
    color:#00ff41;
    text-decoration:none;
}

a:hover{
    color:white;
}
</style>
</head>
<body>

<div class="terminal">

    <div class="line">
        > whoami
    </div>

    <div class="line name">
        Pietro Burini<span class="cursor">|</span>
    </div>

    <div class="line">
        > open website
    </div>

    <div class="line">
        <a href="http://burinburen.altervista.org/" target="_blank">
            [ ACCEDI AL SITO ]
        </a>
    </div>

</div>

</body>
</html>
